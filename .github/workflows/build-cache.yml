# Build the RCABench shard cache and publish it as Release assets.
#
# Consumers (micro-kinetic-ts' `fse26-benchmark.yml`) pin an explicit tag and
# never use `releases/latest`: re-uploading assets with
# `gh release upload --clobber` does not refresh a release's `published_at`, so
# `latest` keeps pointing at whichever release was *created* most recently and
# will silently serve a superseded set. That already happened once -- `latest`
# resolved to `rcabench-full-v2`, whose assets predated the label fan-out fix,
# while the rebuilt shards sat on `rcabench-full`. Consumers additionally verify
# the manifest's converter digest, so a stale tag fails loudly instead of
# publishing a wrong score.
name: Build RCABench cache shards

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload shards to (default rcabench-full)'
        required: false
        default: 'rcabench-full'
      download_prefix_bytes:
        description: 'Download only the first N bytes (0 = full 13.4 GB)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The converter + sharder live in the public micro-kinetic-ts repo. Clone
      # just the scripts so this repo stays data-only (OpenRCA-style separation
      # of data from code).
      #
      # Everything that decides the converted bytes is copied -- including the
      # runtime dependency pin, which is installed below and hashed into the
      # manifest's provenance. The revision is recorded so a consumer can prove
      # which converter produced the shards it is about to score.
      - name: Fetch converter + sharder scripts
        run: |
          git clone --depth 1 https://github.com/AgentiX-E/micro-kinetic-ts.git /tmp/mkt
          cp /tmp/mkt/scripts/fse26_convert.py \
             /tmp/mkt/scripts/fse26_convert_tar.py \
             /tmp/mkt/scripts/fse26_shard.py \
             /tmp/mkt/scripts/fse26_provenance.py \
             /tmp/mkt/scripts/requirements-fse26.txt .
          echo "CONVERTER_REVISION=$(git -C /tmp/mkt rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Converter revision: $(git -C /tmp/mkt rev-parse HEAD)"

      - name: Install converter dependencies
        run: |
          python -m pip install -r requirements-fse26.txt
          python -c "import polars; print('polars', polars.__version__)"

      # Zenodo serves the object from cold storage: the first request may 504
      # while the archive spools, and mid-stream drops are common. The /content
      # endpoint (unlike ?download=1) honours Range/resume, so retry on ALL
      # errors and resume with -C -.
      - name: Download RCABench archive
        run: |
          mkdir -p "$HOME/rcabench"
          RANGE_ARG=()
          if [ "${{ inputs.download_prefix_bytes }}" != "0" ]; then
            RANGE_ARG=(-r "0-${{ inputs.download_prefix_bytes }}")
          fi
          curl -L --fail --retry 30 --retry-all-errors --retry-delay 20 \
            --connect-timeout 60 --speed-limit 1024 --speed-time 90 \
            -C - "${RANGE_ARG[@]}" \
            -o "$HOME/rcabench/rcabench-absolute_anomaly.tar.gz" \
            "https://zenodo.org/api/records/17105974/files/rcabench-absolute_anomaly.tar.gz/content"
          ls -lh "$HOME/rcabench/rcabench-absolute_anomaly.tar.gz"
          df -h "$HOME"

      - name: Convert Parquet to JSON (streaming)
        run: |
          python3 fse26_convert_tar.py \
            --tar "$HOME/rcabench/rcabench-absolute_anomaly.tar.gz" \
            --out-dir "$HOME/rcabench/json"

      - name: Free archive disk space
        if: always()
        run: |
          rm -f "$HOME/rcabench/rcabench-absolute_anomaly.tar.gz"
          df -h "$HOME"

      - name: Shard by fault category
        run: |
          python3 fse26_shard.py --out-dir "$HOME/rcabench/json" \
            --converter-revision "$CONVERTER_REVISION"

      # Print the provenance into the run log so the published cache is
      # traceable from the Actions UI alone.
      - name: Summarise the manifest
        run: |
          python3 -c "
          import json
          m = json.load(open('$HOME/rcabench/json/manifest.json'))
          print('converterRevision', m['converterRevision'])
          print('converterDigest  ', m['converterDigest'])
          print('builtAt          ', m['builtAt'])
          print('totalCases       ', m['totalCases'])
          for s in m['shards']:
              print(f\"  {s['category']:9s} {s['cases']:5d} {s['bytes']:>12d} {s['sha256'][:16]}\")
          "

      - name: Stage shards for upload
        run: |
          mkdir -p dist
          cp "$HOME/rcabench/json"/rcabench-*.tar.gz dist/
          cp "$HOME/rcabench/json"/manifest.json dist/
          ls -lh dist/

      - name: Upload shards to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Generated by build-cache workflow run ${{ github.run_id }} (prefix=${{ inputs.download_prefix_bytes }} bytes). Converter revision ${CONVERTER_REVISION}."
          if gh release view "${{ inputs.release_tag }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.release_tag }}" \
              dist/rcabench-*.tar.gz dist/manifest.json --clobber
            echo "Re-uploaded assets on ${{ inputs.release_tag }}."
            echo "NOTE: --clobber does not refresh published_at, so releases/latest"
            echo "may still point elsewhere. Consumers must pin this tag."
          else
            gh release create "${{ inputs.release_tag }}" \
              dist/rcabench-*.tar.gz dist/manifest.json \
              --title "RCABench cache shards" \
              --notes "$NOTES"
          fi
